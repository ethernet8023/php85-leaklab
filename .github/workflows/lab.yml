name: leaklab
on: push
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: start vulnerable container
        run: |
          sudo -S -p '' sysctl -w kernel.core_pattern=/tmp/core.%p || true
          docker run -d --name lab --privileged --cap-add=SYS_PTRACE \
            -p 8080:80 -v "$PWD/docroot:/var/www/html" \
            php:8.5.11-apache bash -c "ulimit -c unlimited; apache2-foreground"
          sleep 6
          docker exec lab php -v | head -1
      - name: control - benign multipart upload
        run: python3 fire.py benign
      - name: probes - find the write offset
        timeout-minutes: 6
        run: |
          echo '=== probe 288B x90 ==='; timeout 70 python3 -u probe.py 288 90 1.4
          echo '=== probe 263B x90 ==='; timeout 70 python3 -u probe.py 263 90 1.4
          echo '=== probe 200B x90 ==='; timeout 70 python3 -u probe.py 200 90 1.4
          echo '=== probe 288B x20 ==='; timeout 70 python3 -u probe.py 288 20 1.4
          echo '=== error.log ==='
          docker exec lab tail -30 /var/log/apache2/error.log
          echo '=== cores ==='
          docker exec lab bash -c 'ls -la /tmp/core.* 2>/dev/null' || true
      - name: cores artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: cores, path: cores/, if-no-files-found: ignore}
      - name: save cores from container
        if: always()
        run: docker cp lab:/tmp/core-cores ./cores 2>/dev/null; docker exec lab bash -c 'cp /tmp/core.* /var/www/html/ 2>/dev/null' || true; mkdir -p cores; docker cp lab:/var/www/html ./cores/www 2>/dev/null || true
